<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vercel Deployment Test</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, "Noto Sans Thai", sans-serif;
      color: #18212f;
      background: linear-gradient(135deg, #f1f5ff, #f8fbff);
    }
    main {
      width: min(100%, 560px);
      padding: 44px 36px;
      text-align: center;
      background: #fff;
      border: 1px solid #dbe4f1;
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(32, 55, 95, .12);
    }
    .badge {
      display: inline-block;
      margin-bottom: 16px;
      padding: 7px 12px;
      border-radius: 999px;
      color: #075c35;
      background: #eaf8f0;
      font-size: .9rem;
      font-weight: 700;
    }
    h1 { margin: 0 0 12px; font-size: clamp(1.8rem, 5vw, 2.55rem); }
    p { margin: 0; color: #536273; font-size: 1.05rem; line-height: 1.65; }
  </style>
</head>
<body>
  <main>
    <div class="badge">Deployment สำเร็จแล้ว</div>
    <h1>GitHub + Vercel Test</h1>
    <p>หน้านี้ใช้สำหรับทดสอบการเชื่อมต่อระหว่าง GitHub และ Vercel</p>
  </main>
</body>
</html>
